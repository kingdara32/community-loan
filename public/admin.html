<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Community Loan</title>
<style>
:root{--r:#7a0f16;--r2:#9b0d14;--g:linear-gradient(135deg,#9b0d14,#5c0a10)}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f1f2f5;color:#1c1c1e}
a{color:inherit}
/* ---- login gate ---- */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.loginbox{background:#fff;border-radius:14px;box-shadow:0 4px 24px #0002;padding:32px;width:100%;max-width:340px;text-align:center}
.loginbox h1{font-size:20px;margin:0 0 4px}.loginbox p{color:#777;font-size:13px;margin:0 0 20px}
.loginbox input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
.loginbox button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.loginerr{color:#c0392b;font-size:13px;min-height:18px;margin-bottom:6px}
/* ---- shell ---- */
.shell{display:flex;min-height:100vh}
.sidebar{width:210px;flex:none;background:#1c1f26;color:#c7cad1;padding:18px 0}
.brand{padding:0 18px 18px;font-weight:800;color:#fff;font-size:16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2c2f38;margin-bottom:10px}
.brand span{color:#e8b445}
.navitem{padding:11px 18px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.navitem:hover{background:#262a33}
.navitem.on{background:#262a33;border-left-color:#e8b445;color:#fff;font-weight:600}
.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 22px;display:flex;justify-content:space-between;align-items:center}
.topbar b{font-size:15px}
.topstats{display:flex;gap:10px}
.tchip{background:#1c1f26;color:#fff;border-radius:6px;padding:7px 12px;font-size:12px}
.tchip b{color:#e8b445;margin-left:5px}
.logoutbtn{background:#fff;border:1px solid #ddd;border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;margin-left:10px}
.content{padding:22px}
/* ---- cards / tables ---- */
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;margin-bottom:18px}
.cardhd{padding:14px 18px;font-weight:700;font-size:14px;border-bottom:1px solid #eee}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.statcard{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;padding:18px}
.statcard .n{font-size:26px;font-weight:800;color:var(--r2)}
.statcard .l{font-size:12px;color:#888;margin-top:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #eee}
.toolbar input{padding:9px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.toolbar button{padding:9px 12px;border:0;border-radius:6px;background:var(--r2);color:#fff;font-size:13px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f7f9;text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.03em;color:#666;text-transform:uppercase;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid #f0f1f3;vertical-align:top}
tr:hover td{background:#fafbfc}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge.enabled,.badge.approved,.badge.paid,.badge.disbursed,.badge.completed{background:#e6f6ec;color:#16794c}
.badge.disabled,.badge.rejected{background:#fdeaea;color:#c0392b}
.badge.pending{background:#fff3e0;color:#b06a00}
.badge.admin{background:#fdf1da;color:#a3720b}
.badge.auto{background:#eef1f5;color:#5a6270}
.opbtns{display:flex;flex-wrap:wrap;gap:5px;max-width:330px}
.opbtn{border:0;border-radius:5px;padding:5px 9px;font-size:11.5px;cursor:pointer;background:#eef1f6;color:#2b3446;white-space:nowrap}
.opbtn.blue{background:#e7effe;color:#1d4ed8}
.opbtn.red{background:#fdeaea;color:#c0392b}
.opbtn.gold{background:#fdf1da;color:#a3720b}
.opbtn.green{background:#e6f6ec;color:#16794c}
.note{font-size:11.5px;color:#a3720b;background:#fff8ea;border-radius:6px;padding:4px 7px;margin-top:4px;max-width:260px}
.empty{padding:30px;text-align:center;color:#999;font-size:13px}
/* ---- modal ---- */
.modalbg{position:fixed;inset:0;background:#00000066;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modalcard{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto}
.modalcard.wide{max-width:720px}
.modalhd{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-weight:700;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
.modalhd button{background:none;border:0;font-size:16px;cursor:pointer;color:#888}
.modalbody{padding:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px;font:inherit;font-size:13.5px}
.field .hint{font-size:11px;color:#999;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#7a0f16;margin:18px 0 10px;padding-top:12px;border-top:1px solid #f0f1f3}
.section:first-child{margin-top:0;padding-top:0;border-top:0}
.photorow{display:flex;gap:10px;flex-wrap:wrap}
.photobox{width:110px}
.photobox img{width:110px;height:80px;object-fit:cover;border-radius:7px;border:1px solid #e5e7eb;background:#f4f4f4;display:block;cursor:pointer}
.photobox .ph{width:110px;height:80px;border-radius:7px;border:1px dashed #ccc;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px}
.photobox .lbl{font-size:10.5px;color:#888;margin:4px 0 3px;text-align:center}
.photobox .del{width:100%;padding:4px;font-size:10.5px;border:0;border-radius:5px;background:#fdeaea;color:#c0392b;cursor:pointer}
.sigimg{max-width:220px;max-height:100px;border:1px solid #eee;border-radius:7px;background:#fafafa}
.modalft{display:flex;gap:8px;border-top:1px solid #eee;padding:14px 18px;position:sticky;bottom:0;background:#fff}
.modalft button{padding:10px 16px;border:0;border-radius:7px;font-size:13.5px;font-weight:700;cursor:pointer}
.btnmain{background:var(--g);color:#fff}
.btnghost{background:#f1f2f5;color:#333}
.btndanger{background:#fdeaea;color:#c0392b}
.msgline{font-size:12.5px;margin-top:8px}
.msgline.ok{color:#16794c}.msgline.err{color:#c0392b}
.contractbox{white-space:pre-wrap;font-size:12.5px;line-height:1.7;background:#fafbfc;border:1px solid #eee;border-radius:8px;padding:16px;font-family:Georgia,serif}
.tabs{display:flex;gap:6px;padding:10px 18px 0}
.tab{padding:8px 12px;border-radius:7px 7px 0 0;font-size:12.5px;cursor:pointer;color:#777}
.tab.on{background:#fff;color:#7a0f16;font-weight:700;box-shadow:0 -2px 0 var(--r2) inset}
.mtwrap{max-height:340px;overflow-y:auto}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let TOKEN=localStorage.getItem('admin_token')||'';
let PAGE='dashboard',STATS={members:0,pendingLoans:0,pendingWithdrawals:0,totalLoans:0};
let MEMBERS=[],APPS=[],WDRAWS=[],NOTIFS=[],ADMINS=[],LOGINERR='';
let Q='',NQ='',NTAB='all';
let LQ='',WQS='';
let MODAL=null,MDATA=null,MERR='',MOK='';
const CS_COLORS={red:{bg:'#fdeaea',fg:'#c0392b'},green:{bg:'#e6f9ee',fg:'#15803d'},blue:{bg:'#e6f0fd',fg:'#1d4ed8'}};
// The account's real tier is stored as 1–5 (computed from activity), shown here as a credit-score-style
// number: 1→100, 2→300, 3→500, 4→700, 5→900.
const scoreOf=level=>100+(Math.max(1,Math.min(5,level||1))-1)*200;

async function api(path,opt={}){
 const r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json','x-admin-token':TOKEN,...(opt.headers||{})}});
 let j={}; try{j=await r.json()}catch{}
 if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')'));
 return j;
}
async function tryLogin(){
 LOGINERR='';
 const username=$('#loginuser').value.trim();
 const password=$('#loginpass').value;
 if(!username||!password){LOGINERR='Enter your username and password.';render();return}
 try{
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||'Login failed.');
  TOKEN=j.token; localStorage.setItem('admin_token',TOKEN); await boot();
 }catch(e){ TOKEN=''; LOGINERR=e.message||'Wrong username or password.'; render(); }
}
function logout(){TOKEN='';localStorage.removeItem('admin_token');render()}

async function boot(){
 try{
  STATS=await api('/admin/stats');
  await Promise.all([loadMembers(),loadApps(),loadWithdrawals(),loadNotifs(),loadAdmins()]);
 }catch(e){ TOKEN=''; localStorage.removeItem('admin_token'); }
 render();
}
async function loadMembers(){MEMBERS=await api('/admin/members'+(Q?'?q='+encodeURIComponent(Q):''))}
async function loadApps(){APPS=await api('/admin/applications')}
async function loadWithdrawals(){WDRAWS=await api('/admin/withdrawals')}
async function loadNotifs(){NOTIFS=await api('/admin/notifications')}
async function loadAdmins(){ADMINS=await api('/admin/admins')}
async function refreshStats(){STATS=await api('/admin/stats')}

function go(p){PAGE=p;render()}
function openModal(name,data){MODAL=name;MDATA=data||null;MERR='';MOK='';render()}
function closeModal(){MODAL=null;MDATA=null;render()}

// ---------- helpers ----------
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=s=>{if(!s)return'—';const d=new Date(String(s).replace(' ','T')+(String(s).includes('Z')?'':'Z'));return isNaN(d)?s:d.toLocaleString('en-PH',{month:'short',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const dateOnly=s=>{if(!s)return'—';const d=new Date(String(s).replace(' ','T')+(String(s).includes('Z')?'':'Z'));return isNaN(d)?s:d.toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'})};
function within(iso,range){
 const d=new Date(String(iso).replace(' ','T')+(String(iso).includes('Z')?'':'Z')); if(isNaN(d))return true;
 const now=new Date(); const startOfDay=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
 const today=startOfDay(now);
 if(range==='today')return startOfDay(d).getTime()===today.getTime();
 if(range==='yesterday'){const y=new Date(today);y.setDate(y.getDate()-1);return startOfDay(d).getTime()===y.getTime()}
 if(range==='week'){const w=new Date(today);w.setDate(w.getDate()-7);return d>=w}
 if(range==='month'){const m=new Date(today.getFullYear(),today.getMonth(),1);return d>=m}
 if(range==='lastmonth'){const m0=new Date(today.getFullYear(),today.getMonth()-1,1),m1=new Date(today.getFullYear(),today.getMonth(),1);return d>=m0&&d<m1}
 return true;
}
let MRANGE='all';

// ---------- render ----------
function render(){
 const el=$('#app');
 if(!TOKEN){ el.innerHTML=loginView(); return; }
 el.innerHTML=shell();
}
function loginView(){
 return `<div class="loginwrap"><div class="loginbox">
 <h1>💳 Admin</h1><p>Community Loan back office</p>
 <div class="loginerr">${LOGINERR}</div>
 <input id="loginuser" placeholder="Username" onkeydown="if(event.key==='Enter')$('#loginpass').focus()">
 <input id="loginpass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()">
 <button onclick="tryLogin()">Log in</button>
 </div></div>`;
}
function shell(){
 const nav=[['dashboard','📊','Dashboard'],['members','👥','All Members'],['loans','💰','Borrowing List'],['withdrawals','🏧','Withdrawal List'],['notifications','🔔','Notifications'],['staff','🔑','Admin Users']];
 return `<div class="shell">
 <div class="sidebar">
  <div class="brand">💳 <span>Community</span>Loan Admin</div>
  ${nav.map(([k,ic,l])=>`<div class="navitem ${PAGE===k?'on':''}" onclick="go('${k}')">${ic} ${l}</div>`).join('')}
 </div>
 <div class="main">
  <div class="topbar"><b>${({dashboard:'Dashboard',members:'All Members',loans:'Borrowing List',withdrawals:'Withdrawal List',notifications:'Notifications',staff:'Admin Users'})[PAGE]}</b>
   <div style="display:flex;align-items:center">
    <div class="topstats">
     <div class="tchip">New Member<b>${STATS.members}</b></div>
     <div class="tchip">Pending Loans<b>${STATS.pendingLoans}</b></div>
     <div class="tchip">Pending Withdrawals<b>${STATS.pendingWithdrawals}</b></div>
    </div>
    <button class="logoutbtn" onclick="logout()">Log out</button>
   </div>
  </div>
  <div class="content">${pageBody()}</div>
 </div>
 </div>${modalHTML()}`;
}
function pageBody(){
 if(PAGE==='dashboard')return dashboardPage();
 if(PAGE==='members')return membersPage();
 if(PAGE==='loans')return loansPage();
 if(PAGE==='withdrawals')return withdrawalsPage();
 if(PAGE==='notifications')return notificationsPage();
 if(PAGE==='staff')return staffPage();
 return '';
}

// ---------- Dashboard ----------
function dashboardPage(){
 return `<div class="statgrid">
 <div class="statcard"><div class="n">${STATS.members}</div><div class="l">Total members</div></div>
 <div class="statcard"><div class="n">${STATS.totalLoans}</div><div class="l">Total loan applications</div></div>
 <div class="statcard"><div class="n">${STATS.pendingLoans}</div><div class="l">Loans awaiting review</div></div>
 <div class="statcard"><div class="n">${STATS.pendingWithdrawals}</div><div class="l">Withdrawals awaiting review</div></div>
 </div>
 <div class="card"><div class="cardhd">Recent notifications</div>
 <table><thead><tr><th>Date</th><th>Recipient</th><th>Type</th><th>Message</th></tr></thead><tbody>
 ${NOTIFS.slice(0,8).map(n=>`<tr><td>${dt(n.created_at)}</td><td>${n.phone}</td><td><span class="badge ${n.from_admin?'admin':'auto'}">${n.from_admin?'Admin':'Auto'}</span></td><td>${esc(n.message)}</td></tr>`).join('')||`<tr><td class="empty" colspan="4">No notifications yet.</td></tr>`}
 </tbody></table></div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

// ---------- Members ----------
function dateFilterRow(current,onclickFn){
 const opts=[['all','All'],['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['lastmonth','Last Month']];
 return `<div style="display:flex;gap:6px;flex-wrap:wrap">${opts.map(([k,l])=>`<button class="opbtn ${current===k?'blue':''}" onclick="${onclickFn}('${k}')">${l}</button>`).join('')}</div>`;
}
function setMRange(v){MRANGE=v;render()}
function membersPage(){
 const rows=MEMBERS.filter(m=>MRANGE==='all'||within(m.created_at,MRANGE));
 return `<div class="card">
 <div class="toolbar" style="justify-content:space-between">
  <div style="display:flex;gap:8px"><input id="mq" placeholder="Search name or phone" value="${esc(NQ)}" style="width:220px" onkeydown="if(event.key==='Enter')searchMembers()"><button onclick="searchMembers()">Search</button>${NQ?`<button onclick="NQ='';Q='';loadMembers().then(render)" style="background:#eee;color:#333">Clear</button>`:''}</div>
  ${dateFilterRow(MRANGE,'setMRange')}
 </div>
 <div style="overflow-x:auto"><table><thead><tr><th>No.</th><th>Name</th><th>Phone</th><th>Wallet</th><th>Score</th><th>Withdrawal Code</th><th>Registered</th><th>Status</th><th>Note</th><th>Operate</th></tr></thead><tbody>
 ${rows.length?rows.map((m,i)=>memberRow(m,i+1)).join(''):`<tr><td class="empty" colspan="10">No members found.</td></tr>`}
 </tbody></table></div></div>`;
}
async function searchMembers(){Q=$('#mq').value.trim();NQ=Q;await loadMembers();render()}
function memberRow(m,no){
 return `<tr><td>#${no}</td><td>${esc(m.name)||'<span class=\"empty\" style=\"padding:0;display:inline\">—</span>'}</td><td>${m.phone}</td>
 <td><b>${peso(m.balance)}</b></td>
 <td>${scoreOf(m.level)}${m.levelOverridden?' <span style="color:#b06a00" title="Manually set">✎</span>':''}</td>
 <td>${m.hasPin?'Set':'<span style=\"color:#b06a00\">Not set</span>'}</td>
 <td>${dateOnly(m.created_at)}</td><td><span class="badge ${m.status}">${m.status==='enabled'?'Enabled':'Disabled'}</span></td>
 <td>${m.note?`<div class="note">${esc(m.note)}</div>`:''}</td>
 <td><div class="opbtns">
 <button class="opbtn blue" onclick="openMemberDetail(${m.id})">Checking data</button>
 <button class="opbtn" onclick="openModal('wallet',{id:${m.id},phone:'${m.phone}',balance:${m.balance}})">Wallet</button>
 <button class="opbtn gold" onclick="openModal('pin',{id:${m.id},phone:'${m.phone}'})">Withdrawal Code</button>
 <button class="opbtn" onclick="openModal('level',{id:${m.id},phone:'${m.phone}',level:${m.level},levelOverridden:${!!m.levelOverridden}})">Score</button>
 <button class="opbtn" onclick="openModal('identity',{id:${m.id}})">ID Identity</button>
 <button class="opbtn" onclick="openModal('password',{id:${m.id},phone:'${m.phone}'})">Password</button>
 <button class="opbtn" onclick="openModal('bank',{id:${m.id}})">Bank Card Number</button>
 <button class="opbtn ${m.status==='enabled'?'red':'green'}" onclick="toggleStatus(${m.id},'${m.status==='enabled'?'disabled':'enabled'}')">${m.status==='enabled'?'Disable':'Enable'}</button>
 </div></td></tr>`;
}
async function toggleStatus(id,status){
 if(status==='disabled'&&!confirm('Disable this account? The member will not be able to log in.'))return;
 await api(`/admin/members/${id}/status`,{method:'PUT',body:JSON.stringify({status})});
 await loadMembers();render();
}
async function openMemberDetail(id){
 const d=await api(`/admin/members/${id}`);
 openModal('checking',d);
}

// ---------- Checking data modal ----------
function checkingModal(){
 const d=MDATA,p=d.profile||{},idp=p.id||{},per=p.personal||{},bank=p.bank||{},sig=p.signature||{};
 const photo=(field,label)=>`<div class="photobox">${idp[field]?`<img src="/api/admin/file/${idp[field]}?t=${TOKEN}" onclick="viewFile('${idp[field]}')">`:'<div class="ph">No photo</div>'}<div class="lbl">${label}</div>${idp[field]?`<button class="del" onclick="deletePhoto(${d.id},'id','${field}')">Delete</button>`:''}</div>`;
 return `<div class="modalbg" onclick="closeModal()"><div class="modalcard wide" onclick="event.stopPropagation()">
 <div class="modalhd">Checking data — ${d.phone}<button onclick="closeModal()">✕</button></div>
 <div class="modalbody">
  <div class="field"><label>Phone Number</label><input value="${d.phone}" disabled></div>

  <div class="section">Modify Identity</div>
  <div class="row2"><div class="field"><label>ID Card Number</label><input id="ck_idno" value="${esc(idp.id_no||'')}"></div>
  <div class="field"><label>Actual Name</label><input id="ck_name" value="${esc(idp.name||'')}"></div></div>

  <div class="section">ID Photo</div>
  <div class="photorow">${photo('front','Front')}${photo('back','Back')}${photo('selfie','Selfie')}</div>

  <div class="section">Address & Loan Purpose</div>
  <div class="row2"><div class="field"><label>Living (Home Address)</label><input id="ck_addr" value="${esc(per.home_address||'')}"></div>
  <div class="field"><label>Use of Loan</label><input id="ck_purpose" placeholder="Purpose of Apply Loan" value="${esc(per.purpose||'')}"></div></div>

  <div class="section">Emergency Contact</div>
  <div class="row2"><div class="field"><label>Company Name</label><input id="ck_company" value="${esc(per.company||'')}"></div>
  <div class="field"><label>Position</label><input id="ck_position" value="${esc(per.position||'')}"></div></div>
  <div class="row2"><div class="field"><label>Current Address</label><input id="ck_curaddr" value="${esc(per.current_address||'')}"></div>
  <div class="field"><label>Monthly Income</label><input id="ck_salary" value="${esc(per.salary||'')}"></div></div>
  <div class="row2"><div class="field"><label>Contact Person 1 — Name</label><input id="ck_f1name" value="${esc(per.family_name||'')}"></div>
  <div class="field"><label>Relation / Phone</label><div style="display:flex;gap:6px"><input id="ck_f1rel" placeholder="Relation" value="${esc(per.family_rel||'')}"><input id="ck_f1phone" placeholder="Phone" value="${esc(per.family_phone||'')}"></div></div></div>
  <div class="row2"><div class="field"><label>Contact Person 2 — Name</label><input id="ck_f2name" value="${esc(per.emerg_name||'')}"></div>
  <div class="field"><label>Relation / Phone</label><div style="display:flex;gap:6px"><input id="ck_f2rel" placeholder="Relation" value="${esc(per.emerg_rel||'')}"><input id="ck_f2phone" placeholder="Phone" value="${esc(per.emerg_phone||'')}"></div></div></div>

  <div class="section">Signature</div>
  ${sig.image?`<img class="sigimg" src="${sig.image}"><div><button class="opbtn red" style="margin-top:8px" onclick="deletePhoto(${d.id},'signature','image')">Delete signature</button></div>`:`<p class="empty" style="padding:6px 0">No signature on file.</p>`}

  <div class="section">Bank Card Info</div>
  <div class="row2"><div class="field"><label>Bank Name</label><input id="ck_bankname" value="${esc(bank.bank_name||'')}"></div>
  <div class="field"><label>Cardholder's Name</label><input id="ck_holder" value="${esc(bank.holder||'')}"></div></div>
  <div class="field"><label>Account Number</label><input id="ck_acct" value="${esc(bank.account_no||'')}"></div>

  <div id="ckmsg" class="msgline"></div>
 </div>
 <div class="modalft">
  <button class="btnmain" onclick="saveChecking(${d.id})">💾 Save</button>

 w.document.write(`<pre style="font-family:Georgia,serif;font-size:14px;line-height:1.8;max-width:640px;margin:40px auto;white-space:pre-wrap">
LOAN AGREEMENT

Name of the Borrower: ${esc(nm)}
ID Number: ${esc(idno)}
Registered Phone Number: ${esc(a.phone)}
Loan Amount Applied: ${peso(a.amount)}
Repayment Period: ${a.term_months} months
Interest Rate: ${a.annual_rate}% per month
Monthly Repayment: ${peso(a.monthly)}
Beneficiary Name: ${esc(ben)}

This Loan Agreement ("Agreement") is entered into by and between the Lender (hereinafter "Party A") and the Borrower named above (hereinafter "Party B"), collectively the "Parties."

Article 1 — Form of the Loan
This is an unsecured, credit-based loan extended to Party B on the basis of Party B's identity verification and creditworthiness, without the pledge of collateral or security.

Article 2 — Interest Rate
The interest rate applied to this loan is a premium rate that in no case exceeds twenty-five percent (25%) per year, consistent with the Interest Rate and Monthly Repayment stated above.

Article 3 — Tenure Obligations
During the term of this Agreement, Party B agrees to: (a) pay interest on the same date each repayment period; (b) repay the principal amount in full and on time according to the Repayment Period; (c) cooperate fully with Party A if any problem arises with the borrowing account; and (d) comply with all other terms of this Agreement.

Article 4 — Risk Coverage and Repayment Discipline
1. Party B shall bear the credit risk associated with this loan and shall not transfer or assign this obligation to any third party without Party A's written consent.
2. Party B shall truthfully disclose their financial status to Party A upon request, including any material change that could affect their ability to repay.
3. Any attempt to transfer credit obligations in order to conceal financial difficulty is strictly prohibited and constitutes a breach of this Agreement.
4. Repayments are due on the schedule agreed above; Party B shall not unilaterally delay or alter the repayment timing.
5. Where a repayment is more than three (3) days overdue, penalty interest of zero point five percent (0.5%) per day shall accrue on the overdue amount until paid in full.

Article 5 — Party A's Rights Prior to Disbursement
Before releasing the loan, Party A reserves the right to review, verify, and request additional information or documentation from Party B, and may decline or adjust the loan at its discretion based on that review.

Article 6 — Restrictions on Use of Funds
Party B shall not use the loan proceeds for any illegal purpose, including but not limited to gambling, prohibited speculation, or any other activity restricted under applicable law.

Article 7 — Termination and Alteration
This Agreement may only be terminated or altered by written agreement of both Parties, or as otherwise permitted under applicable law. Termination does not relieve Party B of any repayment obligation already due.

Article 8 — Dispute Resolution
Any dispute arising from or in connection with this Agreement shall first be resolved through good-faith negotiation between the Parties, and failing that, through the dispute resolution process available under applicable law.

Article 9 — Insurance
Party A may, where applicable, require or offer a loan-related insurance policy; any such policy's terms and requirements will be disclosed to Party B separately and are subject to Party B's consent where required by law.

Article 10 — Validity
This Agreement becomes valid and binding once it has been confirmed and digitally signed by Party B and accepted by Party A, at which point its terms take effect in full.

Party A: Credit provider.
Party B: Credit receiver.
</pre>`);

async function sendNotify(){

 const box=$('#ntmsg');
 if(!msg){box.textContent='Write a message first.';box.className='msgline err';return}
 try{

   if(!confirm('Send this message to every member?'))return;
   const j=await api('/admin/notify-all',{method:'POST',body:JSON.stringify({message:msg})});
   box.textContent=`Sent to ${j.count} member(s).`;
  }else{
   const phone=$('#nt_phone').value.trim().replace(/[\\s-]/g,'');
   const m=MEMBERS.find(x=>x.phone===phone);
   if(!m){box.textContent='No member with that phone number.';box.className='msgline err';return}
   await api(`/admin/members/${m.id}/notify`,{method:'POST',body:JSON.stringify({message:msg})});
   box.textContent='Sent.';
  }

 <div class="modalbody">
  <div class="row2">
   <div class="field"><label>Username</label><input id="st_user" placeholder="e.g. maria"></div>
   <div class="field"><label>Password</label><input id="st_pass" type="password" placeholder="At least 6 characters"></div>
  </div>
  <button class="opbtn blue" style="padding:9px 16px;font-size:13px" onclick="addAdmin()">Add / Update login</button>
  <div id="stmsg" class="msgline"></div>
 </div></div>
 <div class="card"><div class="cardhd">Who can log in</div>
 <div style="overflow-x:auto"><table><thead><tr><th>Username</th><th>Added</th><th></th></tr></thead><tbody>
 ${ADMINS.length?ADMINS.map(a=>`<tr><td>${esc(a.username)}</td><td>${dt(a.created_at)}</td><td><button class="opbtn red" onclick="deleteAdmin(${a.id})">Remove</button></td></tr>`).join(''):`<tr><td class="empty" colspan="3">No staff logins yet.</td></tr>`}
 </tbody></table></div></div>`;
}
async function addAdmin(){
 const username=$('#st_user').value.trim(),password=$('#st_pass').value;
 const box=$('#stmsg');
 try{
  await api('/admin/admins',{method:'POST',body:JSON.stringify({username,password})});
  box.textContent='Saved.';box.className='msgline ok';
  $('#st_user').value='';$('#st_pass').value='';
  await loadAdmins();render();
 }catch(e){box.textContent=e.message;box.className='msgline err'}
}
async function deleteAdmin(id){
 if(!confirm('Remove this login? They will no longer be able to sign in.'))return;
 try{ await api(`/admin/admins/${id}`,{method:'DELETE'}); await loadAdmins(); render(); }
 catch(e){ alert(e.message); }
}

// ---------- modal dispatch ----------
function modalHTML(){
 if(!MODAL)return'';
 if(MODAL==='checking')return checkingModal();
 if(MODAL==='wallet')return walletModal();
 if(MODAL==='pin')return pinModal();
 if(MODAL==='level')return levelModal();
 if(MODAL==='identity')return identityModal();
 if(MODAL==='password')return passwordModal();
 if(MODAL==='bank')return bankModal();
 if(MODAL==='review')return reviewModal();
 if(MODAL==='modifyLoan')return modifyLoanModal();
 return '';
}

// Keep the back office current without a manual refresh — quietly reloads every ~12 seconds (and right
// away when you switch back to this tab). Never redraws while a modal is open or you're typing/searching,
// so it never interrupts something you're in the middle of editing.
async function silentRefresh(){
 if(!TOKEN)return;
 try{
  await Promise.all([loadMembers(),loadApps(),loadWithdrawals(),loadNotifs(),loadAdmins(),refreshStats()]);
  const typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if(!typing&&!MODAL)render();
 }catch(e){}
}
setInterval(silentRefresh,12000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)silentRefresh()});
window.addEventListener('focus',silentRefresh);

render();
if(TOKEN) boot();
</script>
</body></html>
