<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Loan</title>
<style>
:root{--r1:#5a0a12;--r2:#9b0d14;--gold:#f2b84b;--bg:#f4f4f8;--ink:#1f2937;--mute:#6b7280;--g:linear-gradient(135deg,var(--r1),var(--r2))}
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:88px}
.hd{background:var(--g);color:#fff;padding:18px 16px;text-align:center;font-weight:700;letter-spacing:.04em;position:relative}
.hd .back{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:22px}
.wrap{padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
.tabs{display:flex;justify-content:center;gap:36px;padding-top:6px}.tabs button{background:none;border:0;color:#ffffffaa;font:700 16px inherit;padding:10px 0;border-bottom:3px solid transparent}
.tabs .on{color:#fff;border-color:var(--gold)}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:6px;font:inherit;margin:6px 0 12px;background:#fff}
label{font-size:13px;color:var(--mute)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--r2);color:#fff;font:700 16px inherit;cursor:pointer;margin-top:8px}
.btn.alt{background:#fff;color:var(--r2);border:2px solid var(--gold)}.btn.gold{background:#eea86a;border-radius:99px;width:auto;padding:14px 44px}
.btn:disabled{opacity:.5}
.err{color:#b91c1c;font-size:14px;min-height:20px}.ok{color:#15803d}
.hero{background:var(--g);color:#fff;text-align:center;padding:44px 24px;border-radius:0 0 18px 18px;font-size:20px;font-weight:600;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid #eee;cursor:pointer}.row:last-child{border:0}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:#fde8d8;color:#9b1c1c}.tag.done{background:#dcfce7;color:#166534}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--g);display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:#fff;border:2px solid transparent;border-radius:12px;padding:10px 0;font:600 13px inherit;color:#333}nav .on{color:var(--r2);border-color:var(--r2)}
.faq b{display:block;margin-bottom:6px;font-size:15px}.faq p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.big{font-size:30px;font-weight:700}.mute{color:var(--mute);font-size:13px}
canvas{width:100%;height:260px;background:#e5e7eb;border:2px dashed #9ca3af;touch-action:none;border-radius:4px}
.contract{font-size:14px;line-height:1.6}.contract h4{margin:14px 0 4px}
.status{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px}
.s-pending{background:#fef3c7;color:#92400e}.s-approved,.s-disbursed{background:#dcfce7;color:#166534}.s-rejected{background:#fee2e2;color:#991b1b}
.hero2{position:relative;overflow:hidden;background:var(--g);color:#fff;text-align:center;padding:56px 26px 64px;border-radius:0 0 18px 18px}
.hero2 p{position:relative;z-index:1;margin:0 0 22px;font-size:19px;font-weight:600;line-height:1.45}.hero2 .btn{position:relative;z-index:1;margin:auto;font-size:18px;letter-spacing:.05em}
.hero2 .c1,.hero2 .c2{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff14,#ffffff05);border:1px solid #ffffff1f}
.hero2 .c1{width:420px;height:420px;right:-150px;top:-70px}.hero2 .c2{width:320px;height:320px;right:-110px;top:20px}
.hero2 .bar{position:absolute;left:20px;bottom:12px;width:170px;height:2px;background:#fffc}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:118px 118px 220px;gap:3px}

.pill{flex:1;background:#ffffff26;border-radius:10px;padding:14px;text-align:center;font-weight:700;cursor:pointer}
.ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.ni{font-size:18px;line-height:1.3}nav button{line-height:1.2}
.rowsw{background:#fff}.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid #f0f0f0;background:#fff}
.kv label{color:#333;font-size:16px;flex:none;width:40%}.kv input{border:0;margin:0;text-align:right;padding:18px 0;color:#444;font-size:15px;outline:0;background:transparent}
.sh{background:var(--g);color:#fff;text-align:center;padding:15px;font-size:16px}
.consent{display:flex;gap:10px;align-items:flex-start;padding:16px;font-size:13px;color:#4b5563;line-height:1.5}.consent input{width:auto;margin:3px 0}
.submitbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:5}.submitbar button{width:100%;height:58px;border:0;background:var(--r2);color:#fff;font:400 21px inherit;letter-spacing:.12em;cursor:pointer}.submitbar button:disabled{opacity:.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{position:relative;display:block;aspect-ratio:1.6;border:2px solid #e5e7eb;border-radius:8px;overflow:hidden;cursor:pointer;background:#f8fafc}.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ok2{position:absolute;right:6px;top:6px;background:#16a34a;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.wlist .row{padding:12px 4px}
.loanhero{position:relative;height:170px;background-size:cover;background-position:center;border-radius:0 0 14px 14px;overflow:hidden}
.loanhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#00000090,#00000010 60%)}
.lh-badge{position:absolute;left:16px;bottom:44px;background:#fff;color:#1d4ed8;font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px;z-index:1;box-shadow:0 2px 6px #0003}
.lh-bubble{position:absolute;right:14px;top:16px;background:#fff;color:#111;font-weight:800;font-size:14px;line-height:1.25;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:60%;z-index:1;box-shadow:0 2px 6px #0003}
.amtbig{width:100%;text-align:center;border:2px solid #eecfa8;background:#fffaf1;outline:0;border-radius:10px;padding:8px 0;font-size:32px;font-weight:800;color:#7a0c14;font-family:Georgia,serif;-moz-appearance:textfield}.amtbig:focus{border-color:#9b0d14}.amtbig::-webkit-outer-spin-button,.amtbig::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.amthint{font-size:11px;color:#b08a4e;margin-top:4px}

<script>
const LS=(()=>{const m={};try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch{return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const $=(s,r=document)=>r.querySelector(s);
let PH='',T=LS.getItem('t'),ME=null,view='home',sub=null,tab='login',msg='';
const peso=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pesoWhole=n=>'₱'+Math.round(Number(n)||0).toLocaleString('en-PH');
// Each month's repayment is rounded to the nearest whole peso (no cents). Rounding every month the same way
// would drift from the true total, so whatever that rounding adds up to or loses gets corrected in the very
// last installment instead — every other month is the same round number.
function repaySchedule(a){
 const term=a.term_months,base=Math.round(a.total/term),last=Math.round(a.total)-base*(term-1);
 return Array.from({length:term},(_,i)=>i<term-1?base:last);
}
async function api(path,opt={}){
  const h={...(opt.headers||{})};if(T)h.Authorization='Bearer '+T;
  if(opt.body&&!(opt.body instanceof FormData)){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  let r;try{r=await fetch('/api'+path,{...opt,headers:h})}catch{throw new Error('Cannot reach the server. Start it with npm start and open http://localhost:3000')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&T){T=null;LS.removeItem('t');render()}
  if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;
}
const DEMO=false;
async function load(){ME=await api('/me');try{const n=await api('/notifications');NOTIFS=n.items;NOTIF_UNREAD=n.unread}catch{}}
function go(v,s=null){view=v;sub=s;msg='';render()}
const done=k=>ME?.profile?.[k]?'<span class="tag done">COMPLETE</span>':'<span class="tag">INCOMPLETE</span>';
const bar=(t,back)=>`<div class="hd">${back?`<button class="back" onclick="go('${back}')">‹</button>`:''}${t}</div>`;
const navb=()=>{const tab={home:'home',loan:'home',wallet:'wallet',contact:'contact'}[view]||'account';return `<nav>${[['home','🏠','Home'],['wallet','₱','Wallet'],['contact','💬','Contact'],['account','👤','Account']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ni">${i}</span><br>${l}</button>`).join('')}</nav>`};

async function render(){
  const A=$('#app');
  if(!T){return A.innerHTML=authView()}
  if(!ME)try{await load()}catch{return A.innerHTML=authView()}
  const V={home,loan,wallet,contact,account,settings,repay,profile,contract,withdrawals,id:fID,personal:fPersonal,bank:fBank,signature:fSig}[view]||home;
  A.innerHTML=V()+(['id','personal','bank','signature'].includes(view)?'':navb()+bellHTML())+modalHTML();
  if(view==='signature'&&!ME.profileLocked)initSig();
  if(view==='loan')calc();
}
function authView(){
  const reg=tab==='register';
  return `<div class="hd" style="padding:34px 16px 0">Apply with us, apply with confidence.<div class="tabs"><button class="${!reg?'on':''}" onclick="tab='login';msg='';render()">Login</button><button class="${reg?'on':''}" onclick="tab='register';msg='';render()">Register</button></div></div>
  <div class="wrap"><label>Mobile number</label><input id="ph" inputmode="tel" placeholder="Enter your phone number" autocomplete="username" value="${PH}">
  <label>${reg?'Set your password':'Password'}</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input id="cs" type="checkbox" style="width:auto;margin:4px 0"> <span>I have read and agree to the <a href="#" onclick="event.preventDefault();alert('Add your Privacy Notice and Terms here. State what data you collect, why, who sees it, how long you keep it, and how to request deletion (Data Privacy Act of 2012).')">Privacy Notice and Terms</a>.</span></label>`:''}
  <div class="err ${msg.startsWith('Account created')?'ok':''}">${msg}</div><button class="btn" onclick="auth(${reg})">${reg?'Create account':'Log in'}</button>
  <button class="btn alt" onclick="tab='${reg?'login':'register'}';msg='';render()">${reg?'Back to login':'Register'}</button></div>`;
}
async function auth(reg){
  try{const r=await api(reg?'/register':'/login',{method:'POST',body:{phone:$('#ph').value.replace(/[\s-]/g,''),password:$('#pw').value,consent:reg?$('#cs').checked:undefined}});
    if(reg){PH=$('#ph').value.replace(/[\s-]/g,'');tab='login';msg='Account created. Please log in.';render();return}
    T=r.token;LS.setItem('t',T);ME=null;view='home';PH='';render()}catch(e){PH=$('#ph').value;msg=e.message;render()}
}
function logout(){T=null;ME=null;LS.removeItem('t');tab='login';render()}

function home(){return `<div class="hero2"><div class="c1"></div><div class="c2"></div><p>Solve your financial problems and increase your business with us with an ease !!!</p><button class="btn gold" onclick="go('loan')">Apply Now</button><i class="bar"></i></div>
 <div class="wrap" style="padding-top:14px"><div class="grid"><div class="t t1"><span>Business loans</span></div><div class="t t2"><span>Friendly support</span></div><div class="t t3"><span>Family needs</span></div><div class="t t4"><span>Home &amp; savings</span></div></div>
 <p class="tagline">Apply with us apply with confidence.</p></div>`}


function statusLabel(s){return {pending:'UNDER REVIEW',approved:'APPROVED',disbursed:'DISBURSED',completed:'COMPLETED',rejected:'REJECTED'}[s]||String(s).toUpperCase()}
// When staff set a custom status (Review screen, back office), show that in place of the plain status word —
// same badge spot, just with their chosen text and color (blue/red) instead of the fixed wording.
const CS_COLORS={red:'#dc2626',green:'#16a34a',blue:'#2563eb'};
function statusBadge(a){
 if(a.custom_status)return `<span class="stbadge" style="background:${CS_COLORS[a.custom_status_color]||CS_COLORS.blue}">${esc(a.custom_status).toUpperCase()}</span>`;
 return `<span class="stbadge ${a.status==='rejected'?'rej':a.status==='completed'?'done':''}">${statusLabel(a.status)}</span>`;
}
function statusDesc(a){if(!a)return'';return {pending:'Your application is being reviewed. We will notify you once a decision is made.',approved:'Your loan is approved and will be sent shortly.',disbursed:'Your loan has been sent to your bank account on file.',completed:'This loan has been fully repaid. Thank you.',rejected:'Your application was not approved this time.'}[a.status]||''}
function stepFill(a){return {pending:1,approved:2,disbursed:3,completed:3}[a?a.status:'']||0}
function stepper(fill,labels){return `<div class="steps">${labels.map((l,i)=>`<div class="step ${i<fill?'done':''}"><span class="dot">${i<fill?'✓':''}</span><span class="lbl">${l}</span></div>${i<labels.length-1?`<div class="line ${i<fill-1?'done':''}"></div>`:''}`).join('')}</div>`}
function fmtDate(x){try{const s=String(x||'');return new Date(s.replace(' ','T')+(s.includes('Z')?'':'Z')).toLocaleDateString('en-PH',{day:'2-digit',month:'2-digit',year:'numeric'})}catch{return''}}
function walletLoanCard(a){return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mute">No: ${a.order_no||'—'}</span>${statusBadge(a)}</div>
 <div class="stat3" style="margin:12px 0"><div><b>${a.annual_rate}%</b><br><span class="mute">Interest/Mo</span></div><div><b>${a.term_months}</b><br><span class="mute">Months</span></div><div><b>${peso(a.amount)}</b><br><span class="mute">Principal</span></div></div>
 ${a.status!=='rejected'?stepper(stepFill(a),['Submit Loan','Approve','Receive Money']):''}
 <p style="margin:16px 0 4px"><b>Loan Details</b></p>
 <div class="kvline"><span class="mute">Order number</span><b>${a.order_no||'—'}</b></div>
 <div class="kvline"><span class="mute">Loan amount</span><b>${peso(a.amount)}</b></div>
 <div class="kvline"><span class="mute">Borrowing Time</span><b>${a.term_months} Months</b></div>
 <div class="kvline"><span class="mute">Repayment per installment</span><b>${pesoWhole(repaySchedule(a)[0])}</b></div></div>`}
function loanPageCard(a){return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mute">Order: ${a.order_no||'—'}</span>${statusBadge(a)}</div>
 <div class="stat3" style="margin:12px 0"><div><b>${a.annual_rate}%</b><br><span class="mute">Interest/Mo</span></div><div><b>${a.term_months}</b><br><span class="mute">Months</span></div><div><b>${peso(a.amount)}</b><br><span class="mute">Amount</span></div></div>
 <div style="display:flex;gap:10px"><button class="btn" style="background:#f2b84b;color:#5a0a12;flex:1" onclick="go('contract')">View Contract</button><button class="btn" style="background:#d99a3b;color:#fff;flex:1" onclick="openModal('loanDetails')">Loan Details</button></div>${DEMO&&a.status==='pending'?`<button class="btn alt" style="margin-top:10px" onclick="demoApprove()">Demo: approve this application</button>`:''}${DEMO&&a.status==='approved'?`<button class="btn alt" style="margin-top:10px" onclick="demoDisburse()">Demo: mark as disbursed (sent to bank)</button>`:''}</div>`}
let MODAL=null;function openModal(n){MODAL=n;render()}function closeModal(){MODAL=null;render()}
function modalHTML(){if(!MODAL)return'';
 if(MODAL==='loanDetails'){const a=ME.applications[0];if(!a)return'';
  return `<div class="modalbg" onclick="closeModal()"><div class="modalcard" onclick="event.stopPropagation()"><div class="modalhd">Loan Application<button onclick="closeModal()">✕</button></div>
  <div class="modalbody"><p style="margin-top:0"><b>Loan Progress Timeline</b></p>
  <div class="timelinebox"><div style="display:flex;justify-content:space-between;font-size:12px;opacity:.85"><span>No: ${a.order_no||'—'}</span><span>${fmtDate(a.created_at)}</span></div>${a.status!=='rejected'?stepper(stepFill(a),['Submit','Approve','Disburse']):`<p style="margin:10px 0 0">This application was not approved.</p>`}</div>
  <p style="margin-top:16px"><b>Status Description</b></p><div class="descbox">${a.note||statusDesc(a)}</div>
  <p style="margin-top:16px"><b>Loan Details</b></p>
  <div class="kvline"><span class="mute">Order number</span><b>${a.order_no||'—'}</b></div>
  <div class="kvline"><span class="mute">Principal amount</span><b>${peso(a.amount)}</b></div>
  <div class="kvline"><span class="mute">Borrowing tenure</span><b>${a.term_months} Months</b></div>
  <div class="kvline"><span class="mute">Monthly installment</span><b>${pesoWhole(repaySchedule(a)[0])}</b></div></div></div></div>`}
 if(MODAL==='withdraw'){
  return `<div class="modalbg" onclick="closeModal()"><div class="modalcard" onclick="event.stopPropagation()"><div class="modalhd" style="justify-content:center">Wallet withdrawal</div>

 if(MODAL==='notifications'){return `<div class="notifoverlay" onclick="closeModal()"><div class="notifpanel" onclick="event.stopPropagation()">
  <div class="nfhd">Notifications<button onclick="closeModal()">✕</button></div>

 if(MODAL==='withdrawOk'){
  return `<div class="modalbg" onclick="closeWithdrawOk()"><div class="modalcard" style="background:#f2b84b;color:#5a0a12;text-align:center" onclick="event.stopPropagation()">
  <div class="modalbody" style="padding:30px 22px"><p style="margin:0;font-weight:700;font-size:15px;line-height:1.5">Withdrawal is processing.<br>Please check in Withdrawal Status.</p></div>
  <div class="modalft" style="justify-content:center"><button style="color:#5a0a12;font-weight:800" onclick="closeWithdrawOk()">OK</button></div></div></div>`}
 return ''}
async function doWithdraw(){try{await api('/withdraw',{method:'POST',body:{amount:$('#mwa').value,pin:$('#mwc').value}});await load();MODAL='withdrawOk';render()}catch(e){$('#mwerr').textContent=e.message}}

let NOTIFS=[],NOTIF_UNREAD=0;
function bellHTML(){if(!ME)return'';return `<div class="bellwrap"><button class="bellbtn" onclick="openNotifs()">🔔${NOTIF_UNREAD>0?`<span class="bellbadge">${NOTIF_UNREAD>9?'9+':NOTIF_UNREAD}</span>`:''}</button></div>`}
async function openNotifs(){openModal('notifications');if(NOTIF_UNREAD>0){NOTIF_UNREAD=0;try{await api('/notifications/read',{method:'POST',body:{}})}catch{}}}
function timeAgo(iso){const si=String(iso||'');const t=new Date(si.replace(' ','T')+(si.includes('Z')?'':'Z'));const s=Math.max(0,(Date.now()-t.getTime())/1000);
 if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return t.toLocaleDateString('en-PH',{day:'2-digit',month:'short'})}
function loan(){
  const p=['id','personal','bank','signature'].every(k=>ME.profile[k]),a=ME.applications[0],c=ME.config;
  let h=bar('My loan','account');
  if(a){h+=`<div class="wrap" style="padding-top:14px">${loanPageCard(a)}</div>`}

  }
  return h;
}
function loanForm(c){LT=LT&&c.terms.includes(LT)?LT:c.terms[0];LA=(LA!=null&&LA>=c.min&&LA<=c.max)?LA:c.min;
 return `<div class="loanhero" style="background-image:url(img/home-1.jpg)"><div class="lh-bubble">GET A LOAN<br>TODAY</div><div class="lh-badge">APPLY FOR A LOAN NOW</div></div>
 <div class="wrap" style="padding-top:14px"><div class="card" style="text-align:center"><input id="amBig" class="amtbig" type="number" inputmode="numeric" step="1000" value="${LA}" oninput="typeAmt()" onblur="typeAmtDone()"><div class="mute" style="margin-top:6px">Loan Interest (${c.rate}%)</div></div>
 <div class="stat3"><div><b id="statAmt"></b><br><span class="mute">Loan Amount</span></div><div><b id="statPay"></b><br><span class="mute">Repayment per installment</span></div><div><b id="statTerm"></b><br><span class="mute">Borrowing Time (months)</span></div></div>
 <div class="card"><label>Loan Amount</label><input id="am" type="range" min="${c.min}" max="${c.max}" step="1000" value="${LA}" oninput="onSlide()">
 <div class="mute" style="display:flex;justify-content:space-between"><span>${peso(c.min)}</span><span>${peso(c.max)}</span></div></div>
 <div class="card"><label>Borrowing Time</label><div class="termrow">${c.terms.map(t=>`<button type="button" class="termbtn" data-t="${t}" onclick="pickTerm(${t})">${t} Months</button>`).join('')}</div></div>
 <div class="err" id="lerr">${msg}</div><button class="btn" style="border-radius:99px;font-size:18px" onclick="apply()">Apply Now</button></div>`}
let LT=null,LA=null;
function pickTerm(t){LT=t;calc()}
function calc(){if(!$('#am'))return;const amt=+$('#am').value,c=ME.config;if(!c.terms.includes(LT))LT=c.terms[0];LA=amt;
 const tot=amt*(1+c.rate/100*LT),pay=tot/LT;
 $('#statAmt').textContent=peso(amt);$('#statPay').textContent=pesoWhole(pay);$('#statTerm').textContent=LT;
 document.querySelectorAll('.termbtn').forEach(b=>b.classList.toggle('on',+b.dataset.t===LT))}
function onSlide(){const v=+$('#am').value;if($('#amBig'))$('#amBig').value=v;calc()}
function typeAmt(){const c=ME.config;const n=Math.round(+$('#amBig').value);const v=isNaN(n)?c.min:Math.max(c.min,Math.min(c.max,n));if($('#am'))$('#am').value=v;calc()}
function typeAmtDone(){const c=ME.config;const n=Math.round(+$('#amBig').value);const v=isNaN(n)?c.min:Math.max(c.min,Math.min(c.max,n));if($('#amBig'))$('#amBig').value=v;if($('#am'))$('#am').value=v;calc()}
async function apply(){try{await api('/apply',{method:'POST',body:{amount:$('#am').value,term:LT}});await load();go('loan')}catch(e){msg=e.message;render()}}

// The account's score is normally a flat, automatic 500 (computed server-side) unless staff set it to

const scoreOf=level=>100*Math.max(1,Math.min(9,level||5));
function levelGauge(level){level=Math.max(1,Math.min(9,level||5));const cx=100,cy=108,r=82,startA=180,endA=0;
 const pol=(rad)=>{const t=rad*Math.PI/180;return[cx+r*Math.cos(t),cy-r*Math.sin(t)]};
 const curA=startA-(level-1)/8*(startA-endA);
 const[x1,y1]=pol(startA),[x2,y2]=pol(endA),[xc,yc]=pol(curA);
 const track=`M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
 const prog=`M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${xc.toFixed(1)} ${yc.toFixed(1)}`;
 let ticks='';for(let i=1;i<=9;i++){const a=startA-(i-1)/8*(startA-endA);
  const pin=(rr)=>{const t=a*Math.PI/180;return[cx+rr*Math.cos(t),cy-rr*Math.sin(t)]};
  const[tx1,ty1]=pin(r-9),[tx2,ty2]=pin(r+2),[lx,ly]=pin(r+17);
  ticks+=`<line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}" stroke="#fff" stroke-width="2.5" opacity=".9"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="6.5" fill="#fff" opacity=".9" text-anchor="middle" font-family="Arial" dominant-baseline="middle">${scoreOf(i)}</text>`}
 const[nx,ny]=pol(curA-0),nEnd=(()=>{const t=curA*Math.PI/180;return[cx+(r-14)*Math.cos(t),cy-(r-14)*Math.sin(t)]})();
 return `<svg viewBox="0 0 200 140" width="160" height="112" style="overflow:visible">
 <path d="${track}" fill="none" stroke="#ffffff55" stroke-width="9" stroke-linecap="round"/>
 <path d="${prog}" fill="none" stroke="#f2b84b" stroke-width="9" stroke-linecap="round"/>
 ${ticks}
 <line x1="${cx}" y1="${cy}" x2="${nEnd[0].toFixed(1)}" y2="${nEnd[1].toFixed(1)}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
 <circle cx="${cx}" cy="${cy}" r="5" fill="#fff"/>
 <text x="${cx}" y="${cy-36}" font-size="11" font-weight="700" letter-spacing="2" fill="#ffffffcc" text-anchor="middle" font-family="Arial">SCORE</text>
 <text x="${cx}" y="${cy-9}" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia,serif">${scoreOf(level)}</text>
 <text x="${cx}" y="${cy+7}" font-size="10" fill="#ffffffbb" text-anchor="middle" font-family="Arial">of 900</text>
 </svg>`}

// Keep the app in sync with admin-side changes (status, wallet, level, notifications, etc.)
// without needing a manual refresh or re-login. Refreshes quietly in the background, and only
// redraws the screen when it's safe to (not while the member is typing, has a modal open, or
// is signing) so nothing they're doing gets interrupted or wiped out.
async function silentRefresh(){
  if(!T)return;
  try{
    const me=await api('/me');
    let n=null;try{n=await api('/notifications')}catch{}
    ME=me;
    if(n){NOTIFS=n.items;NOTIF_UNREAD=n.unread}
    const typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    // Never silently redraw a form the member might be mid-way through — an ID/personal-info/bank edit,
    // picking a photo, signing, or choosing a loan amount/term — that would wipe out anything chosen/typed
    // but not yet submitted.
    const editing=['id','personal','bank','signature','loan'].includes(view);
    if(!typing&&!MODAL&&!editing)render();
  }catch(e){}
}
setInterval(silentRefresh,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)silentRefresh()});
window.addEventListener('focus',silentRefresh);
render();
</script></body></html>
